name: Afterstrain
on:
  push:
    paths:
      - 'afterstrain/**'
      - '.github/workflows/afterstrain.yml'
  pull_request:
    paths:
      - 'afterstrain/**'
      - '.github/workflows/afterstrain.yml'
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afterstrain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: afterstrain/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
