name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run docs:check
      - name: Build with disposable pairing
        env:
          TV_IP: 192.0.2.50
          FRAME_HOST: 192.0.2.10
        run: npm run build
      - name: Check shell scripts
        run: for script in scripts/*.sh; do sh -n "$script"; done
