<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src CSP_CONNECT; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="color-scheme" content="dark light"><title>Frame Chat</title><link rel="stylesheet" href="bundle.css"></head>
<body>
<div id="app" class="empty">
  <aside aria-label="Chats">
    <div class="brand"><span>Frame Chat</span><button id="sidebar-close" class="icon-button" aria-label="Hide sidebar" data-nav><span data-icon="sidebar"></span></button></div>
    <button id="new-chat" class="sidebar-action" data-nav><span data-icon="edit"></span>New chat <kbd>Ctrl N</kbd></button>
    <label class="search"><span data-icon="search"></span><input id="chat-search" type="search" readonly placeholder="Search chats" aria-label="Search chats" data-nav></label>
    <div class="section-label">Your chats</div>
    <nav id="chats" aria-label="Saved chats"></nav>
    <div class="account"><div class="account-info"><span class="avatar" aria-hidden="true">F</span><div><span id="account-label">Frame Chat</span><small id="plan-label">Use your ChatGPT subscription</small></div></div><button id="account-button" data-nav>Sign in with ChatGPT</button></div>
    <div class="connection"><span id="connection-dot"></span><span id="connection-label">Starting…</span></div>
  </aside>
  <main>
    <header><div class="selectors"><button id="sidebar-open" class="icon-button" aria-label="Show sidebar" data-nav><span data-icon="sidebar"></span></button><div><button id="model" class="picker-trigger" aria-label="Model" aria-haspopup="dialog" data-nav>Frame Chat</button></div><div><button id="effort" class="picker-trigger" aria-label="Reasoning effort" aria-haspopup="dialog" data-nav></button></div></div><div class="header-actions"><button id="smaller" aria-label="Smaller text" data-nav>A−</button><button id="larger" aria-label="Larger text" data-nav>A+</button><button id="rename" aria-label="Rename chat" class="icon-button" data-nav><span data-icon="edit"></span></button><button id="remove" aria-label="Archive chat" class="icon-button" data-nav><span data-icon="archive"></span></button><button id="settings" aria-label="Settings" class="icon-button" data-nav><span data-icon="settings"></span></button></div></header>
    <section id="conversation" tabindex="0" aria-label="Conversation" data-nav>
      <div id="welcome"><h1>What can I help with?</h1><p id="welcome-hint">Sign in with your ChatGPT subscription.</p></div>
      <div id="messages"></div>
    </section>
    <div class="composer-area"><div id="reply-status" role="status"></div><form id="composer"><textarea id="prompt" rows="1" readonly maxlength="16000" placeholder="Ask anything" aria-label="Message" data-nav></textarea><div class="composer-bottom"><span class="composer-hint">Shift Enter for a new line</span><button id="send" type="submit" aria-label="Send message" class="icon-button" data-nav><span data-icon="send"></span></button><button id="stop" type="button" aria-label="Stop reply" class="icon-button" data-nav hidden><span data-icon="stop"></span></button></div></form><div class="suggestions"><button data-prompt="Explain a surprising scientific idea in plain English." data-nav>Explain something</button><button data-prompt="Help me turn a rough idea into a practical plan. Start by asking what I have in mind." data-nav>Help me plan</button><button data-prompt="Help me write something. Ask what I need and who it is for." data-nav>Write something</button></div><div class="footnote"><span>Frame Chat is unofficial. Check important answers.</span><button id="help" data-nav>Keyboard & remote</button></div></div>
  </main>
</div>
<div id="toast" role="status" hidden></div>
<div id="modal" class="modal" hidden><section role="dialog" aria-modal="true" aria-labelledby="modal-title"><button id="modal-close" class="modal-close icon-button" aria-label="Close dialog" data-nav><span data-icon="close"></span></button><h2 id="modal-title"></h2><div id="modal-body"></div><div id="modal-actions"></div></section></div>
<script src="connection.js"></script><script src="bundle.js"></script>
</body></html>
